<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="Profile.css">
</head>
<body>
    <main class="card">
        <div class="box">
            
        </div>
        <div class="circle"></div>


        <section class="content">
            <h1>SHARMISTHA DAS</h1>
            <p class="role">Frontend Developer</p>
            <p class="skills">HTML <span></span> CSS <span></span> JS <span>*</span> React</p>

            <div class="stats">
                <div class="stat">
                    <h2>EXPERIENCE</h2>
                    <p class="stat-value">4+</p>
                    <p class="stat-detail">Years</p>
                </div>
                <div class="stat">
                    <h2>PROJECTS</h2>
                    <p class="stat-value">10+</p>
                    <p class="stat-detail">Completed</p>
                </div>
            </div>

            <a class="profile-link" href="#">VIEW PROFILE <span aria-hidden="true">→</span></a>
        </section>
    </main>
</body>
</html>
